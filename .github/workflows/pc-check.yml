name: Linux Terminal Demo
on: [push]

jobs:
  terminal-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Execute Linux Commands
        run: |
          echo "Current directory:"
          pwd
          echo "System Info:"
          uname -a
          echo "Pre-installed tools check:"
          git --version
          curl --version
