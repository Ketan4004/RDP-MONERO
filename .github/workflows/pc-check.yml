name: PC Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Check XMRig executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "MONERO\xmrig.exe"
          if (Test-Path $exe) {
            Write-Host "xmrig.exe file mil gayi: $exe"
          } else {
            Write-Error "File nahi mili: $exe"
          }
